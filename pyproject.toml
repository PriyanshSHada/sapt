[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sapt"
version = "0.1.0"
description = "AI-Powered Secure Package Manager for Linux"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Priyansh Singh Hada", email = "priyanshsinghhada@gmail.com"},
]
keywords = ["package-manager", "linux", "ai", "security", "apt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "rapidfuzz>=3.0.0",
    "cryptography>=41.0.0",
    "keyring>=24.0.0",
]

[project.scripts]
sapt = "sapt.__main__:main"

[project.urls]
Homepage = "https://github.com/PriyanshSHada/sapt"
Repository = "https://github.com/PriyanshSHada/sapt"
Issues = "https://github.com/PriyanshSHada/sapt/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.0.0",
    "flake8>=7.0.0",
    "types-requests",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sapt*"]
